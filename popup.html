<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title data-i18n="CV Adapter">CV Adapter</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="popup">
        <header class="brand">
            <div class="brand-mark">CV</div>
            <div>
                <h1 data-i18n="CV Adapter">CV Adapter</h1>
                <p data-i18n="LinkedIn → Google Docs">LinkedIn → Google Docs</p>
            </div>
        </header>
        <section id="errorPanel" class="error-box" hidden></section>
        <section id="latest" class="panel compact">
            <div class="empty">
                <strong data-i18n="No CV created yet">No CV created yet</strong
                ><span data-i18n="Open a job ad on LinkedIn, right-click and choose “Adapt to CV”."
                    >Open a job ad on LinkedIn, right-click and choose “Adapt to CV”.</span
                >
            </div>
        </section>
        <section class="panel compact">
            <div class="section-head">
                <h2 data-i18n="Recent history">Recent history</h2>
                <button id="clearHistory" class="link-button" data-i18n="Clear">Clear</button>
            </div>
            <div id="history" class="history-list"></div>
        </section>
        <footer>
            <button id="settings" class="secondary full" data-i18n="Settings">Settings</button>
        </footer>
        <script src="popup.js" type="module"></script>
    </body>
</html>
